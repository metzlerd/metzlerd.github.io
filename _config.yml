# Site settings
locale                   : "en-US"
title                    : "Donald Metzler"
title_separator          : "-"
name                     : &name "Donald Metzler"
description              : &description "Senior Staff Research Scientist at Google DeepMind"
url                      : https://www.don-metzler.net
baseurl                  : ""
repository               : "metzlerd.github.io"

# Social preview card, in /images/. Used for og:image and twitter:image.
# Pages can override with `og_image:` in their front matter.
og_image                 : "og-image.png"

# Sidebar author profile. Blank/omitted fields are simply not rendered.
# See _includes/author-profile.html for the full list of supported fields.
author:
  avatar           : "profile.png"
  name             : "Donald Metzler"
  bio              : "Generative AI, Information Retrieval"
  employer         : "Google DeepMind"
  googlescholar    : "https://scholar.google.com/citations?user=bmXpOd8AAAAJ&hl=en"
  linkedin         : "donmetzler"
  twitter          : "metzlerd"

# Analytics
analytics:
  google:
    tracking_id          : "G-PLYVPJPY5J"


# Reading Files
include:
  - _pages
  - files
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - node_modules
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles


# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
